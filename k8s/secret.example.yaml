# DO NOT commit real values. Prefer creating the secret imperatively:
#
#   kubectl -n brain create secret generic brain-secrets \
#     --from-literal=BRAIN_TOKEN="$(openssl rand -hex 32)"
#
# Optional, only if you enable LLM enrichment (see README):
#   --from-literal=ANTHROPIC_API_KEY=...   (BRAIN_ENRICH=anthropic)
#   --from-literal=BRAIN_ENRICH_API_KEY=... (BRAIN_ENRICH=openai, if your endpoint needs one)
apiVersion: v1
kind: Secret
metadata:
  name: brain-secrets
  namespace: brain
type: Opaque
stringData:
  BRAIN_TOKEN: "change-me-use-openssl-rand-hex-32"
