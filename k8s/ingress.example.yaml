# Optional. Expose the brain ONLY behind HTTPS. The bearer token is the sole gate unless you add OAuth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brain
  namespace: brain
spec:
  # ingressClassName: nginx
  tls:
    - hosts: [brain.example.com]
      secretName: brain-tls
  rules:
    - host: brain.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: svc-brain, port: {number: 80}}
